name: V2.6 Safety Margin Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safety-margin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyze point-in-time valuation coverage and safety margin
        run: |
          python v2/margin_study.py \
            --input-dir v2/panic/results/run_42474213274_attempt_1 \
            --valuations v2/valuation/point_in_time_valuations.csv \
            --output v2/valuation/results/v2_6_run_${{ github.run_id }}.json
      - name: Archive research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/valuation/results/
          if ! git diff --cached --quiet; then
            git commit -m "V2.6: archive valuation coverage and safety-margin research"
            git push origin HEAD:v2-stock-universe
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: v2-6-safety-margin
          path: v2/valuation/results/*.json
