name: V2.4 Panic Signal Control Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-panic-control-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate signal against same-stock control days
        id: validation
        continue-on-error: true
        run: |
          python v2/validate_panic.py \
            --input-dir v2/panic/results/run_42474213274_attempt_1 \
            --output v2/panic/validation/v2_4_controls_run_${{ github.run_id }}.json
      - name: Archive validation
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/panic/validation/ || true
          if ! git diff --cached --quiet; then
            git commit -m "V2.4: archive controlled panic signal validation"
            git push origin HEAD:v2-stock-universe
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-4-panic-controls
          path: v2/panic/validation/*.json
          if-no-files-found: warn
      - name: Fail on incomplete validation
        if: steps.validation.outcome == 'failure'
        run: exit 1
