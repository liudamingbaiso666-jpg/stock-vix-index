name: V2.6 Match 600900 Financial Report Dates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Map full periodic reports to financial statements
        run: |
          python v2/valuation/match_600900_reports.py \
            --raw-dir v2/valuation/raw/600900/run_42476409498 \
            --output-dir v2/valuation/matched/600900/run_${{ github.run_id }}
      - name: Save auditable candidate mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/valuation/matched/600900/
          git commit -m "V2.6: map 600900 historical report availability" || exit 0
          git push origin HEAD:v2-stock-universe
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-6-600900-report-date-mapping
          path: v2/valuation/matched/600900/run_${{ github.run_id }}/
          if-no-files-found: warn
