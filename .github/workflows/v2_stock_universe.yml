name: V2 Stock Universe

on:
  workflow_dispatch:
  schedule:
    # Mondays 02:20 UTC = 10:20 China Standard Time
    - cron: '20 2 * * 1'

permissions:
  contents: write

concurrency:
  group: v2-stock-universe-history
  cancel-in-progress: false

jobs:
  build-universe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout V2 history branch
        uses: actions/checkout@v4
        with:
          ref: v2-stock-universe
          persist-credentials: true
      - name: Verify V2 program
        run: test -f v2/build_universe.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and validate snapshot
        run: python v2/build_universe.py
      - name: Commit dated snapshot to V2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v2/data/universe_*.csv v2/data/universe_*.json
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "V2: archive validated candidate universe snapshot"
            git push origin HEAD:v2-stock-universe
          fi
      - name: Upload downloadable copy
        uses: actions/upload-artifact@v4
        with:
          name: v2-stock-universe
          path: |
            v2/data/universe_*.csv
            v2/data/universe_*.json
          if-no-files-found: error
          retention-days: 30
