name: V2 Stock Universe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and validate candidate universe
        run: python v2/build_universe.py
      - name: Upload generated CSV and JSON
        uses: actions/upload-artifact@v4
        with:
          name: v2-stock-universe
          path: |
            v2/data/universe_*.csv
            v2/data/universe_*.json
          if-no-files-found: error
          retention-days: 30
