name: On-demand stock VIX

on:
  push:
    paths:
      - "request_stock.txt"
  workflow_dispatch:
    inputs:
      stock_code:
        description: "Six-digit A-share stock code"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stock-vix-results
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Calculate VIX
        env:
          STOCK_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.stock_code || '' }}
        run: |
          if [ -z "$STOCK_CODE" ]; then STOCK_CODE="$(tr -d '\\r\\n ' < request_stock.txt)"; fi
          export STOCK_CODE
          python -c "import os,re; c=os.environ['STOCK_CODE']; assert re.fullmatch(r'[0-9]{6}', c), 'Invalid stock code'" 
          python vix_on_demand.py "$STOCK_CODE"
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Update on-demand stock VIX"
            git push
          fi
