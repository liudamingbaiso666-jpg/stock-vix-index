name: V2.6 600900 Daily Valuation Candidates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Align shares, unadjusted prices, dividends, financials
        run: |
          python v2/valuation/build_600900_daily_valuation_candidates.py \
            --market-dir v2/valuation/market_inputs/600900/run_42478440613 \
            --fundamentals v2/valuation/minimal_pit/600900/run_42478232568/minimal_pit_candidates.csv \
            --output-dir v2/valuation/daily_valuation/600900/run_${{ github.run_id }}
      - name: Archive candidate results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/valuation/daily_valuation/600900/
          if ! git diff --cached --quiet; then
            git commit -m "V2.6 archive 600900 daily valuation candidates"
            git push origin HEAD:v2-stock-universe
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-6-600900-daily-valuation-candidates
          path: v2/valuation/daily_valuation/600900/run_${{ github.run_id }}/
          if-no-files-found: warn
