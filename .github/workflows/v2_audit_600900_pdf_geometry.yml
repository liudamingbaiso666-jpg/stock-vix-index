name: V2.6 600900 PDF Geometric Row Audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas pymupdf
      - name: Audit PDF financial table row geometry
        run: |
          python v2/valuation/audit_600900_pdf_geometry.py \
            --pdf-dir v2/valuation/pdf_evidence/600900/run_42476946834 \
            --audit-file v2/valuation/audit/600900/run_42476685023/historical_fundamental_audit.csv \
            --output-dir v2/valuation/pdf_geometry/600900/run_${{ github.run_id }}
      - name: Save evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/valuation/pdf_geometry/600900/
          if ! git diff --cached --quiet; then
            git commit -m "V2.6: archive 600900 PDF geometric row evidence"
            git push origin HEAD:v2-stock-universe
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-6-600900-pdf-geometry
          path: v2/valuation/pdf_geometry/600900/run_${{ github.run_id }}/
          if-no-files-found: warn
