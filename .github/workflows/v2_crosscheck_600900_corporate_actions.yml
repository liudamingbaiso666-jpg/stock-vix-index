name: V2.6 600900 Corporate Action Crosscheck
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cross-check share and dividend candidate history
        run: |
          python v2/valuation/crosscheck_600900_corporate_actions.py \
            --market-dir v2/valuation/market_inputs/600900/run_42478440613 \
            --audit-csv v2/valuation/audit/600900/run_42476685023/historical_fundamental_audit.csv \
            --daily v2/valuation/daily_valuation/600900/run_42478575722/daily_market_valuation_candidates.csv \
            --output-dir v2/valuation/corporate_action_crosscheck/600900/run_${{ github.run_id }}
      - name: Commit diagnostic outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/valuation/corporate_action_crosscheck/600900/
          if ! git diff --cached --quiet; then
            git commit -m "V2.6 archive 600900 corporate action crosscheck"
            git push origin HEAD:v2-stock-universe
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-6-600900-corporate-action-crosscheck
          path: v2/valuation/corporate_action_crosscheck/600900/run_${{ github.run_id }}/
          if-no-files-found: warn
