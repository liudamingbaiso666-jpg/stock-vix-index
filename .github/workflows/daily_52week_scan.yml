name: Daily 52-week low scanner
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trading date YYYYMMDD (blank = today)'
        required: false
        type: string
      scan_limit:
        description: 'Candidate count (50 for diagnostics; 800 for production)'
        required: false
        default: '800'
        type: string
  schedule:
    - cron: '45 7 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-52week-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-stock-universe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install akshare pandas requests
      - name: Validate exhaustion logic
        run: python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Restore historical OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: v2/cache/ohlcv
          key: ohlcv-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ohlcv-v1-
      - name: Scan all candidates
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            python v2/scan_52week.py --date "${{ inputs.trade_date }}" --limit "${SCAN_LIMIT}"
          else
            python v2/scan_52week.py --limit "${SCAN_LIMIT}"
          fi
        env:
          PYTHONUNBUFFERED: '1'
          SCAN_LIMIT: ${{ inputs.scan_limit || '800' }}
      - name: Validate V1.1 research columns
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files = sorted(Path("v2/reports").glob("low52_*.csv"))
          if not files:
              raise SystemExit("No scan CSV produced")
          required = {"code", "date", "natr_20", "cmf_20", "obv_5d_change"}
          for file in files:
              df = pd.read_csv(file, dtype={"code": str})
              missing = required - set(df.columns)
              if missing:
                  raise SystemExit(f"{file}: missing V1.1 fields {sorted(missing)}")
              if df.empty:
                  raise SystemExit(f"{file}: empty snapshot")
              print(f"{file.name}: rows={len(df)}, NATR={df.natr_20.notna().sum()}, CMF={df.cmf_20.notna().sum()}, OBV={df.obv_5d_change.notna().sum()}")
              if df[["natr_20", "cmf_20", "obv_5d_change"]].isna().all().any():
                  raise SystemExit(f"{file}: V1.1 column entirely missing")
          PY
      - name: Build daily research watchlist
        run: |
          for file in v2/reports/low52_*.csv; do
            [ -f "$file" ] || continue
            python v2/build_watchlist.py "$file"
          done
      - name: Compute experimental selling pressure score
        run: |
          for file in v2/reports/low52_*.csv; do
            [ -f "$file" ] || continue
            python v2/pressure_score.py "$file"
          done
      - name: Generate interactive P plus R dashboard
        run: |
          for file in v2/reports/low52_*.csv; do
            [ -f "$file" ] || continue
            python v2/build_pr_dashboard.py "$file"
          done
      - name: Archive daily P and R snapshots in repository
        if: success()
        run: |
          mkdir -p v2/history
          for file in v2/reports/low52_*.csv v2/reports/pressure_*.csv; do
            [ -f "$file" ] || continue
            cp "$file" v2/history/
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v2/history/low52_*.csv v2/history/pressure_*.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Archive daily P/R research snapshot'
            for attempt in 1 2 3; do
              if git push origin HEAD:v2-stock-universe; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to push daily history after three attempts"
                exit 1
              fi
              echo "Push conflicted; retrying after rebase"
              git fetch origin v2-stock-universe
              git rebase origin/v2-stock-universe
            done
          else
            echo 'No new snapshots to archive'
          fi
          git fetch origin v2-stock-universe
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files=sorted(Path("v2/history").glob("low52_*.csv"))
          if not files:
              raise SystemExit("Archive verification failed: no low52 snapshots")
          recent=files[-1]
          path=recent.as_posix()
          remote=subprocess.run(
              ["git","cat-file","-e",f"origin/v2-stock-universe:{path}"],
              capture_output=True, text=True)
          if remote.returncode != 0:
              raise SystemExit(f"Archive verification failed: missing remote {path}")
          print(f"Archive verified on remote: {path}")
          PY
      - name: Save historical OHLCV cache even on scan failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: v2/cache/ohlcv
          key: ohlcv-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload results even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-52week-scan
          path: v2/reports/
          if-no-files-found: warn
